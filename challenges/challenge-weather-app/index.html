<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>Meteoropolis</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/globals.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
  <main class="content">
    <header class="header">
      <h1 class="title">
        <i>Meteor</i>
        <i>opolis</i>
      </h1>
    </header>

    <!-- Main image -->
    <figure class="photo" id="photo"></figure>

    <!-- Weather description and credits -->
    <div class="info">
      <p class="info__item info__item--conditions" id="conditions"></p>
      <p class="info__item info__item--credits">
        <a href="#" id="credit-user" target="_blank"></a>
        <span>on</span>
        <a href="https://unsplash.com" id="credit-platform" target="_blank">Unsplash</a>
      </p>
    </div>

    <!-- Thumbnails -->
    <div class="thumbs" id="thumbs"></div>

    <!-- Search form -->
    <div class="controls">
      <form class="search" id="search">
        <label class="search__label" for="search-tf">City</label>
        <input class="search__input" id="search-tf" name="city" placeholder="Enter city name" autocomplete="off" />
        <button class="btn search__btn" type="submit">Go</button>
      </form>
    </div>
  </main>

  <!-- JS -->
  <script src="assets/app.js"></script>
</body>

</html>
